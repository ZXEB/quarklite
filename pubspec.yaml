name: quarklite
description: "Quarklite - 夸克网盘不限速下载工具"
publish_to: 'none'

version: 1.3.5+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  background_downloader: ^9.5.8
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  qr_flutter: ^4.1.0
  path_provider: ^2.1.4
  cached_network_image: ^3.4.1
  video_player: ^2.10.0
  flutter_foreground_task: ^8.2.0
  flutter_local_notifications: ^22.3.0
  ffi: ^2.2.0
  crypto: ^3.0.6
  webview_flutter: ^4.14.0
  webview_flutter_windows: ^1.1.1
  # 12.x 需要 win32 ^6.3，与 flutter_secure_storage 9.2.2 冲突，锁 11.x
  file_picker: ^11.0.3
  url_launcher: ^6.2.5
  flutter_miuix: ^1.1.1
  liquid_glass_native: ^0.3.1
  # 在线播放器：media_kit (libmpv/FFmpeg) —— 4K60 硬解 / MKV / 多音轨字幕 / HDR 色调映射
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  # Windows 播放器全屏窗口控制
  window_manager: ^0.5.0
  # 播放时保持屏幕常亮
  wakelock_plus: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  # 内置修复版 flutter_miuix（复制自 pub 1.1.1）：修复 MiuixTextField
  # 占位符不随输入即时消失/删除后不恢复的问题（packages/flutter_miuix）
  flutter_miuix:
    path: packages/flutter_miuix

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
