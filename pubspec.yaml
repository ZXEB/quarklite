name: quarklite
description: "Quarklite - 夸克网盘不限速下载工具"
publish_to: 'none'

version: 1.3.1+21

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  qr_flutter: ^4.1.0
  path_provider: ^2.1.4
  cached_network_image: ^3.4.1
  video_player: ^2.10.0
  flutter_foreground_task: ^8.2.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MiSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MiSans-Bold.ttf
          weight: 700
