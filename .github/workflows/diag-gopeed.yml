name: Diag Gopeed Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-gopeed.yml']

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - name: Download gopeed-web
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/GopeedLab/gopeed/releases/download/v1.9.3/gopeed-web-v1.9.3-windows-amd64.zip" -OutFile gopeed.zip
          Expand-Archive gopeed.zip -DestinationPath gopeed
          $exe = Get-ChildItem -Path gopeed -Recurse -Filter "gopeed*.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "$env:TEMP\gopeed-storage" | Out-Null
          "GOPEED_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $exe.FullName | Select-Object Name, Length

      - name: Start engine like quarklite does
        shell: pwsh
        run: |
          $out = Join-Path $env:TEMP 'gopeed-out.log'
          $err = Join-Path $env:TEMP 'gopeed-err.log'
          $p = Start-Process -FilePath $env:GOPEED_EXE `
            -ArgumentList @('-A','127.0.0.1','-P','0','-T','','-d',(Join-Path $env:TEMP 'gopeed-storage')) `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10
          $alive = $false
          if ($p.HasExited) {
            Write-Host "EXITED code=$($p.ExitCode)"
          } else {
            $alive = $true
            Write-Host "ALIVE pid=$($p.Id)"
            Stop-Process -Id $p.Id -Force
          }
          Write-Host "=== STDOUT ==="
          if (Test-Path $out) { Get-Content $out }
          Write-Host "=== STDERR ==="
          if (Test-Path $err) { Get-Content $err }
          if (-not $alive) { exit 1 } else { exit 0 }

      - name: Reproduce storage lock (2nd instance while 1st alive)
        shell: pwsh
        run: |
          $out1 = Join-Path $env:TEMP 'gopeed-lock1.log'
          $err1 = Join-Path $env:TEMP 'gopeed-lock1-err.log'
          $p1 = Start-Process -FilePath $env:GOPEED_EXE `
            -ArgumentList @('-A','127.0.0.1','-P','0','-T','','-d',(Join-Path $env:TEMP 'gopeed-lock')) `
            -RedirectStandardOutput $out1 -RedirectStandardError $err1 -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          $out2 = Join-Path $env:TEMP 'gopeed-lock2.log'
          $err2 = Join-Path $env:TEMP 'gopeed-lock2-err.log'
          $p2 = Start-Process -FilePath $env:GOPEED_EXE `
            -ArgumentList @('-A','127.0.0.1','-P','0','-T','','-d',(Join-Path $env:TEMP 'gopeed-lock')) `
            -RedirectStandardOutput $out2 -RedirectStandardError $err2 -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          Write-Host "p1 alive=$(-not $p1.HasExited)  p2 alive=$(-not $p2.HasExited)"
          Write-Host "=== p2 STDOUT (lock test) ==="
          if (Test-Path $out2) { Get-Content $out2 }
          Stop-Process -Id $p1.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $p2.Id -Force -ErrorAction SilentlyContinue
          exit 0

      - name: Start engine without -T argument
        shell: pwsh
        run: |
          $out = Join-Path $env:TEMP 'gopeed-out2.log'
          $err = Join-Path $env:TEMP 'gopeed-err2.log'
          $p = Start-Process -FilePath $env:GOPEED_EXE `
            -ArgumentList @('-A','127.0.0.1','-P','0','-d',(Join-Path $env:TEMP 'gopeed-storage2')) `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10
          $alive = $false
          if ($p.HasExited) {
            Write-Host "EXITED code=$($p.ExitCode)"
          } else {
            $alive = $true
            Write-Host "ALIVE pid=$($p.Id)"
            Stop-Process -Id $p.Id -Force
          }
          Write-Host "=== STDOUT ==="
          if (Test-Path $out) { Get-Content $out }
          Write-Host "=== STDERR ==="
          if (Test-Path $err) { Get-Content $err }
          if (-not $alive) { exit 1 } else { exit 0 }
