name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: ver
        shell: bash
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '\r')
          echo "app_version=$VER" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building version: $VER"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache gopeed source
        uses: actions/cache@v4
        with:
          path: /tmp/gopeed-src
          key: gopeed-${{ vars.GOPEED_VERSION || 'v1.9.3' }}
          restore-keys: |
            gopeed-

      - name: Build libgopeed.aar
        run: bash scripts/build_libgopeed.sh
        env:
          GOPEED_VERSION: ${{ vars.GOPEED_VERSION || 'v1.9.3' }}

      - name: Cache keystore
        uses: actions/cache@v4
        with:
          path: android/app/upload-keystore.jks
          key: keystore-${{ github.repository }}

      - name: Keystore + key.properties
        shell: bash
        run: |
          mkdir -p android/app
          if [ ! -f android/app/upload-keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -alias quarklite -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass quarklite2026 -keypass quarklite2026 \
              -dname "CN=QuarkLite, OU=Dev, O=QuarkLite, L=Beijing, S=Beijing, C=CN"
          fi
          # 每次都写，避免 keystore 命中缓存时退回 debug 签名（签名不一致会导致无法覆盖安装）
          printf '%s\n' \
            "storeFile=upload-keystore.jks" \
            "storePassword=quarklite2026" \
            "keyAlias=quarklite" \
            "keyPassword=quarklite2026" > android/key.properties

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quarklite-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

  publish-release:
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: quarklite-apk
          path: release/android

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d+ -f1 | tr -d '\r')
          TAG="v$VER"
          echo "Publishing $TAG"
          ls -lh release/android
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/android/*
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Quarklite $TAG" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              release/android/*
          fi
