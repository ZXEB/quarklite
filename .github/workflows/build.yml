name: Build

on:
  push:
    branches: [main, codex/*]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    if: false # TEMP: iOS-only iteration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version
        shell: bash
        run: "sed -i -E 's/^version:.*/version: 1.3.2+1/' pubspec.yaml"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache gopeed source
        uses: actions/cache@v4
        with:
          path: /tmp/gopeed-src
          key: gopeed-${{ vars.GOPEED_VERSION || 'v1.9.3' }}
          restore-keys: |
            gopeed-

      - name: Build libgopeed.aar
        run: bash scripts/build_libgopeed.sh
        env:
          GOPEED_VERSION: ${{ vars.GOPEED_VERSION || 'v1.9.3' }}

      - name: Keystore (generate + cache)
        id: keystore
        run: |
          mkdir -p android/app
          if [ ! -f android/app/upload-keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -alias quarklite -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass quarklite2026 -keypass quarklite2026 \
              -dname "CN=QuarkLite, OU=Dev, O=QuarkLite, L=Beijing, S=Beijing, C=CN"
            printf '%s\n' \
              "storeFile=upload-keystore.jks" \
              "storePassword=quarklite2026" \
              "keyAlias=quarklite" \
              "keyPassword=quarklite2026" > android/key.properties
          fi
        shell: bash

      - name: Cache keystore
        uses: actions/cache@v4
        with:
          path: android/app/upload-keystore.jks
          key: keystore-${{ github.repository }}

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quarklite-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

  build-windows:
    if: false # TEMP: iOS-only iteration
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version
        shell: pwsh
        run: "(Get-Content pubspec.yaml) -replace '^version:.*$', 'version: 1.3.2+1' | Set-Content pubspec.yaml"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Download gopeed engine
        shell: pwsh
        run: |
          $ver = "${{ vars.GOPEED_VERSION || 'v1.9.3' }}"
          $url = "https://github.com/GopeedLab/gopeed/releases/download/$ver/gopeed-web-$ver-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile gopeed.zip
          Expand-Archive gopeed.zip -DestinationPath gopeed
          New-Item -ItemType Directory -Force -Path windows/resources | Out-Null
          $exe = Get-ChildItem -Path gopeed -Recurse -Filter "gopeed*.exe" | Select-Object -First 1
          if (-not $exe) { throw "gopeed.exe not found in archive" }
          Copy-Item $exe.FullName windows/resources/gopeed.exe
          Get-Item windows/resources/gopeed.exe | Select-Object Name, Length

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release --verbose 2>&1 | Tee-Object -FilePath build_verbose.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build_verbose.log -Tail 120
            exit $LASTEXITCODE
          }

      - name: Package
        shell: pwsh
        run: |
          $dir = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$dir/gopeed.exe")) { throw "gopeed.exe missing from output" }
          Compress-Archive -Path "$dir/*" -DestinationPath quarklite-win.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quarklite-windows
          path: quarklite-win.zip
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          Write-Host "App version: $version"
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Recurse -Filter ISCC.exe | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName "scripts\quarklite.iss" "/DAppVersion=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build\installer | Select-Object Name, Length

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quarklite-setup
          path: build/installer/quarklite-*-setup.exe
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version
        shell: bash
        run: "sed -i '' -E 's/^version:.*/version: 1.3.2+1/' pubspec.yaml"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install iOS pods
        working-directory: ios
        run: pod install --repo-update

      - name: Build unsigned iOS app
        env:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          DEVELOPMENT_TEAM: ''
        run: |
          set +e
          flutter build ios --release --no-codesign --verbose 2>&1 | tee ios_build.log
          build_status=${PIPESTATUS[0]}
          set -e
          # Flutter 3.47 can report its generic signing-team diagnostic after
          # Xcode has already produced the unsigned Runner.app. Only accept
          # that specific post-build condition; real compiler failures still fail.
          # DIAGNOSTIC: dump xcodebuild errors on real build failure.
          if [ "$build_status" -ne 0 ] && [ -d build/ios/iphoneos/Runner.app ]; then
            echo "Flutter returned $build_status after producing unsigned Runner.app; continuing to package it."
          elif [ "$build_status" -ne 0 ]; then
            echo "=== xcodebuild error lines ===="
            grep -nE "error:|fatal error|ld: |Undefined symbol|The following build commands failed|only available in iOS|Command .* failed with a nonzero|note: " ios_build.log | tail -n 120 || true
            echo "=== tail of ios_build.log ===="
            tail -n 200 ios_build.log
            exit "$build_status"
          fi
          test -d build/ios/iphoneos/Runner.app

      - name: Package unsigned IPA
        shell: bash
        run: |
          test -d build/ios/iphoneos/Runner.app
          rm -rf build/ios/ipa-payload
          mkdir -p build/ios/ipa-payload/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa-payload/Payload/
          cd build/ios/ipa-payload
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ../quarklite-ios-unsigned.ipa
          ls -lh ../quarklite-ios-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: quarklite-ios-unsigned
          path: build/ios/quarklite-ios-unsigned.ipa
          if-no-files-found: error

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: [build-android, build-windows, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: quarklite-apk
          path: release/android

      - name: Download Windows archive
        uses: actions/download-artifact@v4
        with:
          name: quarklite-windows
          path: release/windows

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: quarklite-setup
          path: release/installer

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: quarklite-ios-unsigned
          path: release/ios

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.3.2 --repo "$GITHUB_REPOSITORY" --clobber \
              release/android/* release/windows/* release/installer/* release/ios/*
          else
            gh release create v1.3.2 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Quarklite v1.3.2" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              release/android/* \
              release/windows/* \
              release/installer/* \
              release/ios/*
          fi

